name: NEXUS Scraper

on:
  schedule:
    - cron: '0 */17 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      # 1. Run scraper → produces scraper/jobs.json
      - name: Run scraper
        run: |
          cd scraper
          dart pub get
          dart run bin/scraper.dart

      # 2. Move jobs.json to root then zip
      - name: Zip dataset
        run: |
          mv scraper/jobs.json jobs.json
          zip jobs.zip jobs.json

      # 3. Generate sha256 hash
      - name: Generate hash
        run: echo "HASH=$(sha256sum jobs.zip | cut -d' ' -f1)" >> $GITHUB_ENV

      # 4. Create release if not exists, then upload
      - name: Upload to GitHub Releases
        run: |
          gh release view latest || gh release create latest --title "Latest Dataset" --notes "Auto-updated dataset"
          gh release upload latest jobs.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Upload to Hugging Face
      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload to Hugging Face
        run: |
          python3 -c "
          from huggingface_hub import HfApi
          HfApi().upload_file(
            path_or_fileobj='jobs.zip',
            path_in_repo='jobs.zip',
            repo_id='Yash514311/nexus-jobs',
            repo_type='dataset',
            token='${{ secrets.HF_TOKEN }}'
          )
          print('Uploaded to Hugging Face successfully')
          "

      # 6. Update config.json
      - name: Update config.json
        run: |
          echo '{
            "version": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
            "dataset_url": "https://huggingface.co/datasets/Yash514311/nexus-jobs/resolve/main/jobs.zip",
            "hash": "'$HASH'",
            "min_app_version": "3.0.0"
          }' > docs/config.json

      # 7. Push config.json — skip if nothing changed
      - name: Push config.json to GitHub Pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/config.json
          git diff --staged --quiet || git commit -m "chore: update dataset config [skip ci]"
          git push